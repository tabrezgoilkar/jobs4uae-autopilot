name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npx vitest run

  telegram-poc:
    name: Telegram scrape (live dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The repost CLI only imports local ES modules — no npm install needed.
      # Dry-run scrapes the real t.me/s/WePostJobs preview and prints what it
      # would forward, proving live parsing works without sending anything.
      - run: node scripts/telegram-repost.js --dry-run
